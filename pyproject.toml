[project]
name = "hydrarag"
version = "0.1.0"
description = "Dynamic RAG: upload any file or URL, ask questions, get answers with sources."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "beautifulsoup4>=4.12",
    "docling>=2.115.0",
    "docling-core[chunking]>=2.87.1",
    "google-genai>=1.0",
    "langchain-core>=0.3",
    "langchain-groq>=1.1.3",
    "pillow>=12.3.0",
    "pinecone>=5.0",
    "playwright>=1.40",
    "pymupdf>=1.24",
    "python-dotenv>=1.2.2",
    "qwen-vl-utils>=0.0.14",
    "requests>=2.31",
    "sentence-transformers>=5.6.1",
    "tenacity>=8.2",
    "torch>=2.13.0",
    "transformers>=5.8.1",
    "urllib3>=2.0",
]
